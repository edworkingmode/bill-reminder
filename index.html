<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>繳費提醒</title>
<meta name="theme-color" content="#ececeb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="繳費提醒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 視覺語言：紙灰底＋漸層玻璃卡＋大數字。以手機寬度（≤430px）為主，字仍維持長輩可讀的大小。 */
:root {
  --paper: #ececeb; --ink: #222222; --copy: #4a4a4a; --soft: #6b6b6b;
  --glass-line: rgba(255, 255, 255, .36); --line: rgba(0, 0, 0, .08);
  --card: rgba(255, 255, 255, .78); --shadow: 0 2px 4px rgba(50, 28, 39, .12), 0 10px 24px rgba(50, 28, 39, .06);
  --accent: #ad314d; --red: #b42318; --amber: #8a5a00; --amber-soft: #fff3d6; --green: #2f7a55;
  --g-crimson: radial-gradient(ellipse 68% 45% at -4% -3%, rgba(255,235,232,.55), transparent 77%), radial-gradient(ellipse 70% 45% at 104% -4%, rgba(255,238,233,.5), transparent 78%), radial-gradient(ellipse 64% 49% at -8% 106%, rgba(255,222,199,.42), transparent 78%), radial-gradient(ellipse 54% 30% at 50% 17%, rgba(106,8,51,.22), transparent 78%), linear-gradient(180deg, #bd4468 0%, #ad355b 38%, #a63b50 72%, #8c1320 100%);
  --g-violet: radial-gradient(ellipse 43% 42% at -5% 30%, rgba(228,220,255,.53), transparent 78%), radial-gradient(ellipse 43% 42% at 105% 30%, rgba(245,200,210,.54), transparent 78%), radial-gradient(ellipse 78% 25% at 15% 8%, rgba(218,211,255,.54), transparent 79%), linear-gradient(164deg, #c9b5e1 0%, #ad80ca 29%, #9d4f72 64%, #793246 100%);
  --g-orange: radial-gradient(ellipse 54% 14% at 56% 0%, rgba(255,206,190,.16), transparent 76%), radial-gradient(ellipse 80% 36% at 62% 57%, rgba(255,141,36,.62), transparent 72%), radial-gradient(ellipse 60% 32% at 97% 101%, rgba(190,40,44,.42), transparent 76%), linear-gradient(177deg, #d84736 0%, #dd523c 24%, #e8703d 52%, #de5641 78%, #d34239 100%);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100svh; color: var(--ink); background: var(--paper);
  font: 19px/1.5 "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
  font-optical-sizing: auto; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
main { width: min(100%, 430px); margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom)); }
h1 { font-size: 30px; font-weight: 500; letter-spacing: .015em; line-height: 1.223; margin: 6px 0 2px; color: #202020; }
h2 { font-size: 17px; font-weight: 600; letter-spacing: .02em; margin: 26px 2px 10px; color: var(--soft); }
.sub { color: var(--copy); margin: 0 0 10px; font-size: 17px; }
.banner { background: var(--amber-soft); color: var(--amber); border-radius: 14px; padding: 10px 14px; font-size: 16px; margin-bottom: 12px; }
button { font: inherit; border: 0; border-radius: 999px; cursor: pointer; -webkit-tap-highlight-color: transparent; }

/* 大數字：粗體、等寬，遠看也清楚 */
.num { font-family: "Inter", sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }

/* 本月進度：紅色大數字 */
.progress { margin: 6px 0 4px; }
.progress .big { display: flex; align-items: flex-end; gap: 10px; color: var(--accent); }
.progress .big .num { font-size: 52px; }
.progress .big small { color: var(--copy); font-size: 17px; padding-bottom: 4px; }
.bar { height: 8px; border-radius: 99px; background: rgba(173, 49, 77, .12); overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s; }

/* 主卡：下一筆要繳的帳單，用漸層玻璃卡 */
.hero { position: relative; overflow: hidden; isolation: isolate; border: 1px solid var(--glass-line); border-radius: 17px; color: #fff; padding: 22px 20px 20px; margin: 18px 0 6px; text-align: center;
  background: var(--g-crimson); background-origin: border-box; box-shadow: 0 2px 4px rgba(50,28,39,.30), inset 0 1px 0 rgba(255,255,255,.24); }
.hero.violet { background: var(--g-violet); background-origin: border-box; }
.hero.orange { background: var(--g-orange); background-origin: border-box; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; mix-blend-mode: screen; pointer-events: none;
  background: linear-gradient(102deg, rgba(255,255,255,.10), transparent 28%, rgba(255,255,255,.08) 62%, transparent 88%), radial-gradient(ellipse 85% 34% at 54% 7%, rgba(255,255,255,.24), transparent 72%); }
.hero .grain { position: absolute; inset: -8%; width: 116%; height: 116%; z-index: -1; opacity: .5; mix-blend-mode: soft-light; pointer-events: none; }
.hero .label { font-size: 15px; letter-spacing: .04em; opacity: .9; }
.hero .title { font-size: 24px; font-weight: 600; line-height: 1.35; margin: 4px 0 14px; text-shadow: 0 1px 1px rgba(72,28,48,.14); }
.hero .metric { display: flex; justify-content: center; align-items: flex-end; gap: 6px; color: rgba(255,255,255,.97); filter: drop-shadow(0 1px 1px rgba(104,27,54,.08)); }
.hero .metric .num { font-size: 72px; }
.hero .metric .unit { font-size: 26px; line-height: 1; padding-bottom: 4px; }
.hero .caption { color: rgba(255,255,255,.87); font-size: 17px; margin: 12px 0 16px; }
.hero .pay { background: rgba(255,255,255,.97); color: #2d2d2d; min-width: 140px; height: 52px; font-size: 19px; font-weight: 500;
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 1px 3px rgba(58,25,39,.08); transition: transform .18s ease, box-shadow .18s ease; }
.hero .pay:active { transform: translateY(1px); }

/* 一般清單卡：紙上的霧白玻璃 */
.card { background: var(--card); border: 1px solid rgba(255,255,255,.9); border-radius: 17px; padding: 14px 14px 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.card .info { flex: 1; min-width: 0; }
.card .name { font-size: 20px; font-weight: 600; line-height: 1.35; }
.card .meta { color: var(--soft); font-size: 16px; }
.card .chip { width: 10px; align-self: stretch; border-radius: 99px; flex: 0 0 auto; background: var(--g-crimson); }
.card .chip.violet { background: var(--g-violet); } .card .chip.orange { background: var(--g-orange); }
.card.overdue { box-shadow: inset 0 0 0 2px var(--red), var(--shadow); }
.card.today { box-shadow: inset 0 0 0 2px #d99a1e, var(--shadow); }
.tag { display: inline-block; font-size: 14px; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: rgba(0,0,0,.06); color: var(--copy); margin-left: 6px; vertical-align: 2px; }
.tag.red { background: var(--red); color: #fff; }
.pay { background: #222; color: #fff; padding: 0 18px; height: 48px; font-size: 18px; font-weight: 500; min-width: 84px; }
.ghost { background: transparent; color: var(--accent); padding: 8px 10px; font-weight: 500; }
.empty { color: var(--soft); text-align: center; padding: 18px 0; font-size: 17px; }
.todo { background: var(--card); border-radius: 17px; padding: 12px 16px; color: var(--copy); box-shadow: var(--shadow); font-size: 17px; }
.done .name { color: var(--soft); text-decoration: line-through; }
.card.leaving, .hero.leaving { animation: leave .45s ease forwards; }
@keyframes leave { 30% { transform: scale(1.02); } 100% { transform: translateX(40px); opacity: 0; } }

nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 0 16px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
nav .tabs { pointer-events: auto; width: min(100%, 398px); display: flex; background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.9); border-radius: 999px; box-shadow: 0 8px 24px rgba(50,28,39,.14); padding: 5px;
  -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3); }
nav button { flex: 1; background: none; height: 50px; font-size: 17px; color: var(--soft); }
nav button.on { background: #222; color: #fff; font-weight: 600; }

.toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); max-width: 398px; margin: 0 auto; background: rgba(34,34,34,.94); color: #fff; border-radius: 17px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 6px; font-size: 17px; z-index: 10; }
.toast span { flex: 1; }
.toast button { background: rgba(255,255,255,.16); color: #fff; padding: 8px 12px; font-size: 16px; }

dialog { border: 0; border-radius: 22px; padding: 20px; width: min(398px, calc(100% - 24px)); max-height: 88svh; background: #f7f7f6; color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.35); }
label { display: block; margin: 12px 0 4px; color: var(--soft); font-size: 16px; }
input, select { font: inherit; font-size: 18px; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); }
.row { display: flex; gap: 10px; margin-top: 18px; }
.row button { flex: 1; height: 54px; font-size: 18px; }
.primary { background: #222; color: #fff; font-weight: 600; }
.secondary { background: rgba(0,0,0,.07); color: var(--ink); }
.hint { font-size: 14px; color: var(--soft); margin-top: 4px; }

/* 主要按鈕：漸層發光（參考 Edison 提供的 outer-cont）。手機沒有 hover，所以按下時發光。 */
.primary, .card .pay, .ob-bottom .primary { position: relative; isolation: isolate; border: none; color: #fff; font-weight: 600;
  background: linear-gradient(90deg, #5bfcc4, #f593e4, #71a4f0); border-radius: 14px; text-shadow: 1px 1px 1px #000;
  box-shadow: inset 0 0 5px #ffffffa9, inset 0 35px 30px #000, 0 5px 10px #000000cc; transition: all .3s ease; }
.primary::before, .card .pay::before { content: ""; position: absolute; inset: 0; margin: auto; border-radius: 14px; z-index: -1; filter: blur(0);
  background: conic-gradient(#00000000 80deg, #40baf7, #f34ad7, #5bfcc4, #00000000 280deg); transition: all .3s ease; }
.primary:hover::before, .card .pay:hover::before, .primary:focus-visible::before, .card .pay:focus-visible::before { filter: blur(15px); }
.primary:active::before, .card .pay:active::before { filter: blur(5px); transform: translateY(1px); }
.primary:active, .card .pay:active { box-shadow: inset 0 0 5px #ffffffa9, inset 0 35px 30px #000; transform: translateY(3px); }
.primary:disabled { filter: grayscale(.6); }

/* 輸入欄位：聚焦時漸層光圈＋微微浮起 */
input:not([type=checkbox]), select { transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease, background .25s ease; }
input:not([type=checkbox]):focus, select:focus { outline: none; border-color: transparent; transform: translateY(-1px);
  background: linear-gradient(#fff, #fff) padding-box, linear-gradient(90deg, #5bfcc4, #f593e4, #71a4f0) border-box; border: 2px solid transparent;
  box-shadow: 0 0 0 4px rgba(245, 147, 228, .18), 0 6px 18px rgba(113, 164, 240, .22); }
input:not([type=checkbox]):not(:placeholder-shown):not(:focus) { background: #fffdfd; border-color: rgba(173, 49, 77, .28); }

/* 勾選框：自製圓角方塊，勾起來會彈一下 */
input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; margin: 0; border-radius: 7px; border: 2px solid rgba(0,0,0,.25); background: #fff;
  display: inline-grid; place-content: center; cursor: pointer; transition: background .2s ease, border-color .2s ease; flex: 0 0 auto; }
input[type=checkbox]::after { content: ""; width: 7px; height: 12px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg) scale(0); margin-top: -3px; transition: transform .25s cubic-bezier(.34, 1.56, .64, 1); }
input[type=checkbox]:checked { border-color: transparent; background: linear-gradient(135deg, #5bfcc4, #f593e4 55%, #71a4f0); animation: pop .3s ease; }
input[type=checkbox]:checked::after { transform: rotate(45deg) scale(1); }
@keyframes pop { 50% { transform: scale(1.18); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden><div class="tabs">
  <button data-view="home" class="on">要繳的</button>
  <button data-view="bills">全部帳單</button>
  <button data-view="history">已繳紀錄</button>
</div></nav>

<dialog id="payDlg">
  <form method="dialog" id="payForm">
    <h2 id="payTitle" style="margin-top:0;color:var(--ink)"></h2>
    <p class="sub" id="paySub"></p>
    <label for="payAmount">這期繳了多少錢？</label>
    <input id="payAmount" type="number" inputmode="numeric" min="0" placeholder="例如 3200">
    <div class="row">
      <button value="cancel" class="secondary">取消</button>
      <button value="ok" class="primary">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="billDlg">
  <form method="dialog" id="billForm"></form>
</dialog>

<script src="config.js"></script>
<script src="onboarding.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
const CATEGORY = { credit_card: '信用卡', interest: '利息', rent: '房租', water: '水費', electricity: '電費', gas: '瓦斯費', phone: '電話', other: '其他' };
const cfg = window.APP_CONFIG || {};
const DEMO = !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || (location.hostname === 'localhost' && location.search.includes('demo'));  // 本機加 ?demo 可試畫面
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- 日期工具（一律用本地日期字串 YYYY-MM-DD，避免時區偏移） ----------
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const lastDay = (y, m) => new Date(y, m + 1, 0).getDate();
const onDay = (y, m, d) => new Date(y, m, Math.min(d, lastDay(y, m)));   // 31 號遇到小月取月底
const fmtDate = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`; };

// 帳單規則 → 指定區間內的每一期到期日
function occurrences(bill, from, to) {
  const out = [], f = parse(from), t = parse(to);
  if (bill.due_type === 'monthly_day' && bill.due_day) {
    for (let y = f.getFullYear(), m = f.getMonth(); new Date(y, m, 1) <= t; m++) {
      if (m > 11) { m = 0; y++; }
      const d = onDay(y, m, bill.due_day);
      if (d >= f && d <= t) out.push(ymd(d));
    }
  } else if (bill.due_type === 'every_n_months' && bill.anchor_date) {
    const a = parse(bill.anchor_date), n = bill.interval_months || 2;
    for (let k = -24; k <= 24; k++) {
      const d = onDay(a.getFullYear(), a.getMonth() + k * n, a.getDate());
      if (d >= f && d <= t) out.push(ymd(d));
    }
  }
  return out;
}
const needsInfo = b => (b.due_type === 'monthly_day' && !b.due_day) || (b.due_type === 'every_n_months' && !b.anchor_date) || b.due_type === 'manual';
const billLabel = b => b.location ? `${b.name}・${b.location}` : b.name;

// ---------- 資料層：示範模式（localStorage）或 Supabase，介面相同 ----------
function demoSeed() {
  // 通用範例資料（不放真實帳單；真實資料在資料庫裡）
  const bills = [
    { name: '範例信用卡 A', category: 'credit_card', due_type: 'monthly_day', due_day: 15, statement_day: 1 },
    { name: '範例信用卡 B', category: 'credit_card', due_type: 'monthly_day', due_day: 5, statement_day: 20, note: '隔月繳' },
    { name: '房租', category: 'rent', location: '範例地址', due_type: 'monthly_day', due_day: 1, amount_type: 'fixed', default_amount: 15000 },
    { name: '電費', category: 'electricity', location: '範例地址', due_type: 'every_n_months', interval_months: 2, anchor_date: null },
    { name: '手機費', category: 'phone', due_type: 'monthly_day', due_day: null }
  ];
  const created = todayStr();
  return { bills: bills.map(b => ({ id: crypto.randomUUID(), active: true, interval_months: 1, amount_type: 'variable', created_at: created, ...b })), payments: [] };
}
const demoStore = {
  load() { try { return JSON.parse(localStorage.getItem('bills-demo')) || null; } catch { return null; } },
  save(db) { try { localStorage.setItem('bills-demo', JSON.stringify(db)); } catch {} },
  db: null,
  async init() { this.db = this.load() || demoSeed(); this.save(this.db); return true; },
  async bills() { return this.db.bills.filter(b => b.active); },
  async payments() { return this.db.payments; },
  async pay(bill_id, due_date, amount) { this.db.payments = this.db.payments.filter(p => !(p.bill_id === bill_id && p.due_date === due_date)); this.db.payments.push({ id: crypto.randomUUID(), bill_id, due_date, amount, status: 'paid', paid_at: new Date().toISOString() }); this.save(this.db); },
  async unpay(id) { this.db.payments = this.db.payments.filter(p => p.id !== id); this.save(this.db); },
  async saveBill(b) { if (b.id) Object.assign(this.db.bills.find(x => x.id === b.id), b); else this.db.bills.push({ ...b, id: crypto.randomUUID(), active: true, created_at: todayStr() }); this.save(this.db); },
  async removeBill(id) { this.db.bills.find(x => x.id === id).active = false; this.save(this.db); }
};
const sb = DEMO ? null : supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
const cloudStore = {
  async init() { const { data } = await sb.auth.getSession(); return !!data.session; },
  async bills() { const { data, error } = await sb.from('bills').select('*').eq('active', true).order('created_at'); if (error) throw error; return data; },
  async payments() { const { data, error } = await sb.from('payments').select('*').order('due_date', { ascending: false }).limit(500); if (error) throw error; return data; },
  async pay(bill_id, due_date, amount) { const { error } = await sb.from('payments').upsert({ bill_id, due_date, amount, status: 'paid', paid_at: new Date().toISOString() }, { onConflict: 'bill_id,due_date' }); if (error) throw error; },
  async unpay(id) { const { error } = await sb.from('payments').delete().eq('id', id); if (error) throw error; },
  async saveBill(b) { const { id, created_at, user_id, ...fields } = b; const q = id ? sb.from('bills').update(fields).eq('id', id) : sb.from('bills').insert(fields); const { error } = await q; if (error) throw error; },
  async removeBill(id) { const { error } = await sb.from('bills').update({ active: false }).eq('id', id); if (error) throw error; }
};
const store = DEMO ? demoStore : cloudStore;

// ---------- 畫面 ----------
let view = 'home', BILLS = [], PAYS = [];
async function refresh() {
  try { [BILLS, PAYS] = await Promise.all([store.bills(), store.payments()]); }
  catch (e) { $('#app').innerHTML = `<p class="banner">讀取失敗：${esc(e.message)}</p>`; return; }
  render();
  if (view === 'home' && window.shouldOnboard?.(BILLS)) openOnboarding();
}
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  const head = DEMO ? '<div class="banner">示範模式：資料只存在這台裝置，還沒連上資料庫。</div>' : '';
  $('#app').innerHTML = head + ({ home: homeView, bills: billsView, history: historyView }[view])();
}

function homeView() {
  const today = todayStr(), paid = new Set(PAYS.map(p => p.bill_id + '|' + p.due_date));
  const back = ymd(new Date(Date.now() - 60 * 86400000)), ahead = ymd(new Date(Date.now() + 31 * 86400000));
  const items = [];
  for (const b of BILLS) {
    const start = b.created_at && b.created_at.slice(0, 10) > back ? b.created_at.slice(0, 10) : back;  // 建立前的期數不算逾期
    for (const due of occurrences(b, start, ahead)) if (!paid.has(b.id + '|' + due)) items.push({ b, due, days: daysBetween(today, due) });
  }
  items.sort((x, y) => x.due.localeCompare(y.due));
  // 本月進度：這個月到期的期數裡，已繳幾筆
  const d0 = new Date(), monthStart = ymd(new Date(d0.getFullYear(), d0.getMonth(), 1)), monthEnd = ymd(new Date(d0.getFullYear(), d0.getMonth() + 1, 0));
  let total = 0, done = 0;
  for (const b of BILLS) {
    const start = b.created_at && b.created_at.slice(0, 10) > monthStart ? b.created_at.slice(0, 10) : monthStart;
    for (const due of occurrences(b, start, monthEnd)) { total++; if (paid.has(b.id + '|' + due)) done++; }
  }
  const tone = b => ['water', 'electricity', 'gas'].includes(b.category) ? 'violet' : ['rent', 'phone', 'interest'].includes(b.category) ? 'orange' : '';
  const card = ({ b, due, days }) => {
    const cls = days < 0 ? 'overdue' : days === 0 ? 'today' : '';
    const when = days < 0 ? `<span class="tag red">過期 ${-days} 天</span>` : days === 0 ? '<span class="tag red">今天</span>' : `<span class="tag">${days} 天後</span>`;
    const amt = b.default_amount ? `・約 ${Number(b.default_amount).toLocaleString()} 元` : '';
    return `<div class="card ${cls}"><span class="chip ${tone(b)}"></span><div class="info"><div class="name">${esc(billLabel(b))}${when}</div><div class="meta">${fmtDate(due)} 截止${amt}</div></div><button class="pay" data-pay="${b.id}|${due}">繳了</button></div>`;
  };
  // 最急的一筆放成主卡，其餘照時間排
  const top = items[0], rest = items.slice(1);
  const hero = top ? (() => {
    const { b, due, days } = top;
    const [n, unit, label] = days < 0 ? [-days, '天', '已經過期'] : days === 0 ? ['今天', '', '今天截止'] : [days, '天後', '下一筆要繳'];
    const amt = b.default_amount ? `・約 ${Number(b.default_amount).toLocaleString()} 元` : '';
    return `<div class="hero ${tone(b)}"><svg class="grain" viewBox="0 0 429 554" preserveAspectRatio="none" aria-hidden="true"><filter id="cardNoise"><feTurbulence type="fractalNoise" baseFrequency=".54" numOctaves="3" seed="27" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#cardNoise)"/></svg>
      <div class="label">${label}</div><div class="title">${esc(billLabel(b))}</div>
      <div class="metric"><span class="num">${n}</span>${unit ? `<span class="unit">${unit}</span>` : ''}</div>
      <div class="caption">${fmtDate(due)} 截止${amt}</div>
      <button class="pay" data-pay="${b.id}|${due}">繳了</button></div>`;
  })() : '';
  const now = rest.filter(i => i.days <= 0), week = rest.filter(i => i.days > 0 && i.days <= 7), later = rest.filter(i => i.days > 7);
  const missing = BILLS.filter(needsInfo).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  return `<h1>要繳的帳單</h1><p class="sub">今天 ${fmtDate(today)}</p>
    ${total ? `<div class="progress"><div class="big"><span class="num">${done}/${total}</span><small>${done === total ? '本月全部繳完了 🎉' : '本月已繳'}</small></div><div class="bar"><i style="width:${pct}%"></i></div></div>` : ''}
    ${hero || (BILLS.length ? '<div class="empty">一個月內沒有要繳的帳單</div>'
      : `<div class="hero"><div class="label">歡迎使用</div><div class="title">先把第一筆帳單<br>加進來吧</div><div class="caption">例如一張信用卡：填名稱和每月幾號截止就好，其他可以之後再補。</div><button class="pay" onclick="openOnboarding()">開始設定</button></div>`)}
    ${now.length ? `<h2>今天要繳／已過期</h2>${now.map(card).join('')}` : ''}
    ${week.length ? `<h2>這 7 天內</h2>${week.map(card).join('')}` : ''}
    ${later.length ? `<h2>之後一個月</h2>${later.map(card).join('')}` : ''}
    ${missing ? `<div class="todo" style="margin-top:24px">還有 ${missing} 筆帳單沒有繳款日，<button class="ghost" data-go="bills">去補資料 ›</button></div>` : ''}`;
}

function billsView() {
  const groups = {};
  for (const b of BILLS) (groups[CATEGORY[b.category] || '其他'] ||= []).push(b);
  const rule = b => needsInfo(b) ? '<span class="tag red">待補</span>'
    : b.due_type === 'monthly_day' ? `每月 ${b.due_day} 號` : `每 ${b.interval_months} 個月，從 ${fmtDate(b.anchor_date)} 起算`;
  return `<h1>全部帳單</h1><p class="sub">點一筆可以修改。共 ${BILLS.length} 筆。</p>` +
    Object.entries(groups).map(([g, list]) => `<h2>${esc(g)}</h2>` + list.map(b =>
      `<div class="card" data-edit="${b.id}" style="cursor:pointer"><div class="info"><div class="name">${esc(billLabel(b))}</div><div class="meta">${rule(b)}${b.note ? '・' + esc(b.note) : ''}</div></div><span style="color:var(--soft)">›</span></div>`).join('')).join('') +
    `<div class="row"><button class="primary" data-edit="">＋ 新增帳單</button></div>` +
    `<div class="row"><button class="secondary" onclick="openOnboarding()">用引導一次加很多筆</button></div>` +
    (DEMO ? '' : `<div class="row"><button class="secondary" id="logout">登出</button></div>`);
}

function historyView() {
  const byId = Object.fromEntries(BILLS.map(b => [b.id, b]));
  const list = PAYS.filter(p => byId[p.bill_id]).sort((a, b) => b.due_date.localeCompare(a.due_date)).slice(0, 60);
  return `<h1>已繳紀錄</h1>` + (list.length ? list.map(p => `<div class="card done"><div class="info"><div class="name">${esc(billLabel(byId[p.bill_id]))}</div><div class="meta">${fmtDate(p.due_date)} 那期${p.amount ? `・${Number(p.amount).toLocaleString()} 元` : ''}</div></div><button class="ghost" data-unpay="${p.id}">按錯了</button></div>`).join('') : '<div class="empty">還沒有紀錄</div>');
}

// ---------- 繳費：一按完成，金額之後可補 ----------
let payTarget = null, toastTimer = null;
async function quickPay(btn, billId, due) {
  const b = BILLS.find(x => x.id === billId);
  const amt = b.amount_type === 'fixed' && b.default_amount ? Number(b.default_amount) : null;
  btn.disabled = true; btn.closest('.card, .hero').classList.add('leaving');
  try { await store.pay(billId, due, amt); }
  catch (e) { alert('存檔失敗：' + e.message); btn.disabled = false; btn.closest('.card, .hero').classList.remove('leaving'); return; }
  setTimeout(refresh, 450);
  showToast(`✓ ${billLabel(b)} 已繳`, [
    ['補金額', () => openPay(billId, due)],
    ['復原', async () => { const p = PAYS.find(x => x.bill_id === billId && x.due_date === due); if (p) { await store.unpay(p.id); refresh(); } }]
  ]);
}
function showToast(text, actions) {
  document.querySelector('.toast')?.remove(); clearTimeout(toastTimer);
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(text)}</span>` + actions.map((a, i) => `<button data-i="${i}">${a[0]}</button>`).join('');
  t.onclick = e => { const i = e.target.dataset.i; if (i !== undefined) { t.remove(); actions[i][1](); } };
  document.body.appendChild(t); toastTimer = setTimeout(() => t.remove(), 7000);
}
function openPay(billId, due) {
  const b = BILLS.find(x => x.id === billId); payTarget = { b, due };
  $('#payTitle').textContent = billLabel(b); $('#paySub').textContent = `${fmtDate(due)} 截止的這一期`;
  $('#payAmount').value = b.default_amount ?? '';
  $('#payDlg').showModal();
}
$('#payDlg').addEventListener('close', async () => {
  if ($('#payDlg').returnValue !== 'ok' || !payTarget) return;
  const amt = $('#payAmount').value ? Number($('#payAmount').value) : null;
  try {
    await store.pay(payTarget.b.id, payTarget.due, amt);
    if (amt && !payTarget.b.default_amount) await store.saveBill({ ...payTarget.b, default_amount: amt });  // 第一次填的金額當參考
  } catch (e) { alert('存檔失敗：' + e.message); }
  refresh();
});

// ---------- 編輯帳單 ----------
function openBill(id) {
  const b = BILLS.find(x => x.id === id) || { category: 'other', due_type: 'monthly_day', interval_months: 1, amount_type: 'variable' };
  const opt = (obj, cur) => Object.entries(obj).map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${v}</option>`).join('');
  $('#billForm').innerHTML = `
    <h2 style="margin-top:0;color:var(--ink)">${id ? '修改帳單' : '新增帳單'}</h2>
    <label>名稱</label><input name="name" required value="${esc(b.name)}">
    <label>類別</label><select name="category">${opt(CATEGORY, b.category)}</select>
    <label>地址（房租、水電用來分辨）</label><input name="location" value="${esc(b.location)}" placeholder="例如 某某路">
    <label>多久繳一次</label><select name="due_type">${opt({ monthly_day: '每個月', every_n_months: '每兩個月' }, b.due_type === 'manual' ? 'monthly_day' : b.due_type)}</select>
    <div data-show="monthly_day"><label>每月幾號截止</label><input name="due_day" type="number" min="1" max="31" inputmode="numeric" value="${b.due_day ?? ''}" placeholder="不知道可以先空著"></div>
    <div data-show="every_n_months"><label>最近一期的截止日</label><input name="anchor_date" type="date" value="${b.anchor_date ?? ''}"><div class="hint">看帳單上的日期填一次，之後系統自動每兩個月往後算。</div></div>
    <label>金額</label><select name="amount_type">${opt({ variable: '每期不一樣', fixed: '每期一樣' }, b.amount_type)}</select>
    <label>大約金額（元）</label><input name="default_amount" type="number" min="0" inputmode="numeric" value="${b.default_amount ?? ''}">
    <label>怎麼繳</label><input name="pay_method" value="${esc(b.pay_method)}" placeholder="例如 自動扣款、超商">
    <label>卡號末四碼或門號末幾碼（不要填完整號碼）</label><input name="account_hint" maxlength="6" value="${esc(b.account_hint)}">
    <label>備註</label><input name="note" value="${esc(b.note)}">
    <div class="row"><button value="cancel" class="secondary" formnovalidate>取消</button><button value="ok" class="primary">儲存</button></div>
    ${id ? '<div class="row"><button value="delete" class="secondary" formnovalidate style="color:var(--red)">不用再繳了，刪除</button></div>' : ''}`;
  const sync = () => $('#billForm').querySelectorAll('[data-show]').forEach(el => el.hidden = el.dataset.show !== $('#billForm').due_type.value);
  $('#billForm').due_type.onchange = sync; sync();
  $('#billDlg').dataset.id = id || ''; $('#billDlg').showModal();
}
$('#billDlg').addEventListener('close', async () => {
  const rv = $('#billDlg').returnValue, id = $('#billDlg').dataset.id, f = $('#billForm');
  try {
    if (rv === 'delete') { if (confirm('確定不再提醒這筆帳單？')) await store.removeBill(id); }
    else if (rv === 'ok') {
      const num = v => v === '' ? null : Number(v), txt = v => v.trim() || null;
      const base = BILLS.find(x => x.id === id) || {};
      const due_type = f.due_type.value;
      await store.saveBill({ ...base, name: f.name.value.trim(), category: f.category.value, location: txt(f.location.value), due_type,
        due_day: num(f.due_day.value), anchor_date: f.anchor_date.value || null, interval_months: due_type === 'every_n_months' ? 2 : 1,
        amount_type: f.amount_type.value, default_amount: num(f.default_amount.value), pay_method: txt(f.pay_method.value),
        account_hint: txt(f.account_hint.value), note: txt(f.note.value) });
    } else return;
  } catch (e) { alert('存檔失敗：' + e.message); }
  refresh();
});

// ---------- 事件 ----------
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-pay],[data-edit],[data-unpay],[data-go],#logout,nav button');
  if (!t) return;
  if (t.dataset.pay) { const [id, due] = t.dataset.pay.split('|'); quickPay(t, id, due); }
  else if (t.dataset.edit !== undefined) openBill(t.dataset.edit);
  else if (t.dataset.unpay) { if (confirm('把這筆改回「還沒繳」？')) { await store.unpay(t.dataset.unpay); refresh(); } }
  else if (t.dataset.go) { view = t.dataset.go; render(); }
  else if (t.id === 'logout') { await sb.auth.signOut(); location.reload(); }
  else if (t.dataset.view) { view = t.dataset.view; render(); scrollTo(0, 0); }
});

// ---------- 登入（email 登入連結，不用記密碼） ----------
function loginView() {
  $('#app').innerHTML = `<h1>繳費提醒</h1><p class="sub">輸入 email，我們會寄一封登入信給您，點信裡的連結就能進來。</p>
    <form id="login"><label for="email">Email</label><input id="email" type="email" required autocomplete="email">
    <div class="row"><button class="primary">寄登入信</button></div></form><p id="msg" class="sub"></p>`;
  $('#login').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithOtp({ email: $('#email').value.trim(), options: { emailRedirectTo: location.origin + location.pathname } });
    $('#msg').textContent = error ? '寄送失敗：' + error.message : '已寄出，請到信箱點連結。';
  };
}
(async () => {
  let shown = false;
  const showApp = () => { if (shown) return; shown = true; $('#nav').hidden = false; refresh(); };
  // 回呼裡不能直接呼叫 Supabase（會卡住），用 setTimeout 移出去；也不再重新整理頁面，避免無限重載
  if (!DEMO) sb.auth.onAuthStateChange((ev, session) => { if (session) setTimeout(showApp, 0); });
  if (await store.init()) showApp(); else if (!shown) loginView();
})();
</script>
</body>
